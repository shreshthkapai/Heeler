name: Fork island probe
on:
  workflow_dispatch:
  push:
    branches: ['fork-ci/island-probe']
permissions:
  contents: read
concurrency:
  group: fork-island-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    if: github.repository == 'shreshthkapai/Heeler'
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      OUT: ${{ github.workspace }}/probe-results
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: Build the probe
        working-directory: probe/island
        run: |
          mkdir -p "$OUT"
          xcodebuild -version | tee "$OUT/toolchain.txt"
          xcodegen generate
          xcodebuild -project IslandProbe.xcodeproj -scheme IslandProbe \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build build | tail -30
      - name: Screenshot each variant on each phone
        working-directory: probe/island
        run: |
          set +e
          app=build/Build/Products/Debug-iphonesimulator/IslandProbe.app
          xcrun simctl list runtimes -j > "$OUT/runtimes.json"
          xcrun simctl list devicetypes > "$OUT/devicetypes.txt"
          for want in iPhone-16-Plus iPhone-15-Plus iPhone-15-Pro-Max iPhone-17-Pro-Max iPhone-17; do
            type="com.apple.CoreSimulator.SimDeviceType.$want"
            runtime=$(python3 -c "
          import json,sys
          rs=[r for r in json.load(open(sys.argv[1]))['runtimes'] if r['platform']=='iOS' and r['isAvailable'] and any(d['identifier']==sys.argv[2] for d in r.get('supportedDeviceTypes',[]))]
          print(rs[-1]['identifier'] if rs else '')" "$OUT/runtimes.json" "$type")
            echo "== $want on ${runtime:-no runtime}"
            [ -n "$runtime" ] || continue
            udid=$(xcrun simctl create "probe-$want" "$type" "$runtime") || continue
            xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b || continue
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryLevel 100 --cellularBars 4 --wifiBars 3
            xcrun simctl install "$udid" "$app" || continue
            for v in nofix equal-inward design-3 design-2 design-1; do
              xcrun simctl launch --terminate-running-process "$udid" dev.example.islandprobe -variant "$v"
              sleep 6
              xcrun simctl launch "$udid" com.apple.Preferences
              sleep 4
              xcrun simctl io "$udid" screenshot "$OUT/$want-$v.png"
            done
            xcrun simctl spawn "$udid" log show --last 5m --predicate 'eventMessage CONTAINS "PROBE"' > "$OUT/$want-log.txt"
            xcrun simctl shutdown "$udid"
          done
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: island-probe-${{ github.sha }}
          path: probe-results
          retention-days: 14
