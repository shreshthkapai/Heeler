name: Fork island probe
on:
  workflow_dispatch:
  push:
    branches: ['fork-ci/island-probe']
permissions:
  contents: read
concurrency:
  group: fork-island-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    if: github.repository == 'shreshthkapai/Heeler'
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      OUT: ${{ github.workspace }}/probe-results
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: Build the probe
        working-directory: probe/island
        run: |
          mkdir -p "$OUT"
          xcodebuild -version | tee "$OUT/toolchain.txt"
          xcodegen generate
          xcodebuild -project IslandProbe.xcodeproj -scheme IslandProbe -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build build-for-testing | tail -20
          xcodebuild -project IslandProbe.xcodeproj -scheme IslandProbeOther -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build build | tail -5
      - name: Read island positions on each phone
        working-directory: probe/island
        run: |
          set +e
          xcrun simctl list runtimes -j > "$OUT/runtimes.json"
          xcrun simctl list devicetypes > "$OUT/devicetypes.txt"
          other=build/Build/Products/Debug-iphonesimulator/IslandProbeOther.app
          for want in iPhone-16-Plus iPhone-18-Pro; do
            type="com.apple.CoreSimulator.SimDeviceType.$want"
            runtime=$(python3 -c "
          import json,sys
          rs=[r for r in json.load(open(sys.argv[1]))['runtimes'] if r['platform']=='iOS' and r['isAvailable'] and any(d['identifier']==sys.argv[2] for d in r.get('supportedDeviceTypes',[]))]
          print(rs[-1]['identifier'] if rs else '')" "$OUT/runtimes.json" "$type")
            echo "== $want on ${runtime:-no runtime}"
            [ -n "$runtime" ] || continue
            udid=$(xcrun simctl create "probe-$want" "$type" "$runtime") || continue
            xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryLevel 100 --cellularBars 4 --wifiBars 3
            xcrun simctl install "$udid" "$other"
            xcodebuild test-without-building -project IslandProbe.xcodeproj -scheme IslandProbe \
              -destination "id=$udid" -derivedDataPath build -resultBundlePath "$OUT/$want.xcresult" \
              -only-testing:IslandProbeUITests/ProbeUITests/test3Landscape \
              > "$OUT/$want-test.log" 2>&1
            echo "test exit $?"
            grep -c PROBE-BEGIN "$OUT/$want-test.log"
            xcrun xcresulttool export attachments --path "$OUT/$want.xcresult" --output-path "$OUT/$want-attachments"
            xcrun simctl shutdown "$udid"
          done
          cp ~/Library/Logs/DiagnosticReports/*Widget* "$OUT/" 2>/dev/null
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: island-probe-${{ github.sha }}
          path: probe-results
          retention-days: 14
