name: Fork island build
on:
  workflow_dispatch:
  push:
    branches: ['fork-ci/island-393']
permissions:
  contents: read
concurrency:
  group: fork-island-393-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  render:
    if: github.repository == 'shreshthkapai/Heeler'
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        phone: [iPhone-16, iPhone-16-Plus]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      OUT: ${{ github.workspace }}/render-results
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - name: Build the render apps
        working-directory: probe/render
        run: |
          mkdir -p "$OUT"
          xcodegen generate
          xcodebuild -project IslandRender.xcodeproj -scheme IslandRender -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build build-for-testing \
            > "$OUT/build.log" 2>&1; status=$?
          tail -20 "$OUT/build.log"; grep -E "error:" "$OUT/build.log" | head -40 || true
          [ $status -eq 0 ] || exit $status
          xcodebuild -project IslandRender.xcodeproj -scheme IslandRenderOther -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build build | tail -5
      - name: Boot ${{ matrix.phone }}
        working-directory: probe/render
        run: |
          xcrun simctl list runtimes -j > "$OUT/runtimes.json"
          type="com.apple.CoreSimulator.SimDeviceType.${{ matrix.phone }}"
          runtime=$(python3 -c "
          import json,sys
          rs=[r for r in json.load(open(sys.argv[1]))['runtimes'] if r['platform']=='iOS' and r['isAvailable'] and any(d['identifier']==sys.argv[2] for d in r.get('supportedDeviceTypes',[]))]
          print(rs[-1]['identifier'])" "$OUT/runtimes.json" "$type")
          udid=$(xcrun simctl create render "$type" "$runtime")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/IslandRenderOther.app
      - name: Compact
        working-directory: probe/render
        timeout-minutes: 30
        run: ./render-test.sh test1Compact
      - name: Minimal
        working-directory: probe/render
        timeout-minutes: 30
        run: ./render-test.sh test2Minimal
      - name: Landscape
        working-directory: probe/render
        timeout-minutes: 30
        run: ./render-test.sh test3Landscape
      - name: Expanded
        working-directory: probe/render
        timeout-minutes: 30
        run: ./render-test.sh test4Expanded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: island-render-${{ matrix.phone }}-${{ github.sha }}
          path: render-results
          retention-days: 14
